<body>
    <h1>Inline vs Block Elements</h1>
    <hr/>
    <h3>Inline Elements</h3>
    <ol> <li> Takes only necessary width </li>
        <li> Dont start from a new line </li>
        <li>Ex: Anchor tag,Image </li>
        <li> <a href="www.google.com">Google</a></li>
        <li>Apple <img src="https://thumbs.dreamstime.com/b/red-apple-isolated-clipping-path-19130134.jpg" alt="apple" height="20px" width="20px" /></li>
    </ol>
    <hr/>

    <h3>Block Elements</h3>
    <ol>
        <li>Takes the full block</li>
        <li>Start from the new line</li>
        <li>EX: Tittle , Paragraph element</li>
    </ol>

</body>
</html>
